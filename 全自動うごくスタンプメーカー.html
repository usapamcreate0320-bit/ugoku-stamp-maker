<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全自動うごくスタンプメーカー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/upng-js/2.1.0/UPNG.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f6f1ff;--card:#fff;--ink:#3b3050;--sub:#8a7fa0;--line:#e3d9f5;--pink:#ff8fc4;--mint:#7fdcc0;--chk1:#fff;--chk2:#ece6f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a2b;--card:#2a2339;--ink:#f1eaff;--sub:#a99cc4;--line:#3f3555;--chk1:#352d47;--chk2:#2a2339}}
:root[data-theme="dark"]{--bg:#1f1a2b;--card:#2a2339;--ink:#f1eaff;--sub:#a99cc4;--line:#3f3555;--chk1:#352d47;--chk2:#2a2339}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:500;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;font-weight:900;margin:8px 0 2px;letter-spacing:.02em}
.lead{color:var(--sub);margin:0 0 18px;font-size:14px}
#drop{border:3px dashed var(--pink);border-radius:28px;background:var(--card);padding:34px 16px;text-align:center;cursor:pointer}
#drop.on{background:color-mix(in srgb,var(--pink) 15%,var(--card))}
#drop b{display:block;font-size:19px;font-weight:900}
#drop span{font-size:13px;color:var(--sub)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.opts label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:3px}
select,button{font:inherit;color:var(--ink)}
select{padding:9px 10px;border:2px solid var(--line);border-radius:14px;background:var(--card)}
.btn{background:var(--pink);color:#fff;border:0;border-radius:999px;padding:13px 22px;font-weight:900;font-size:16px;cursor:pointer}
.btn.sub{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
#msg{font-size:13px;color:var(--sub)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.cell{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:6px;text-align:center;cursor:pointer;position:relative}
.cell canvas{width:100%;height:auto;border-radius:12px;background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/14px 14px;display:block}
.cell small{display:block;line-height:1.3;font-size:10px;color:var(--sub)}

.cell.off{opacity:.35}.cell.sel{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink)}
#edit[hidden]{display:none}
#edit{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4px);z-index:5;background:var(--card);border:2px solid var(--pink);border-radius:22px;padding:10px;margin-bottom:14px;box-shadow:0 6px 18px rgba(80,50,120,.18)}
.eh{display:flex;gap:10px;align-items:center}
#big{width:84px;height:auto;border-radius:14px;flex:none;background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/12px 12px}
.et{flex:1;display:flex;flex-direction:column;gap:4px}
.ck{display:flex;align-items:center;gap:6px;font-size:13px}
.btn.sm{padding:7px 12px;font-size:12px}
.eg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.eg label{font-size:10px;color:var(--sub);display:flex;flex-direction:column;gap:2px;min-width:0}
.eg select{padding:6px 4px;font-size:12px;border-radius:10px;width:100%}
#edit.fold .eg{display:none}
.note{font-size:12px;color:var(--sub);margin-top:18px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head>
<body><main>
<h1>全自動うごくスタンプメーカー</h1>
<p class="lead">絵を入れるだけ。切り分け・背景透明・動き・飾り・容量調整まで全部おまかせで、LINEの規格のAPNGにします。</p>

<div id="drop" tabindex="0"><b>ここに絵を選ぶ</b><span>4×4などに並べた1枚でも、1個ずつの絵（複数）でもOK</span>
<input id="file" type="file" accept="image/*" multiple hidden></div>

<div class="opts">
<label>種類<select id="kind"><option value="emoji">うごく絵文字 180×180</option><option value="stamp">うごくスタンプ 320×270</option></select></label>
<label>動き（全体）<select id="motion"></select></label>
<label>飾り（全体）<select id="deco"></select></label>
<label>飾りの数<select id="dnum"></select></label>
<label>飾りの色<select id="dcol"></select></label>
<label>飾りの速さ<select id="dspd"></select></label>
<label>飾りの動き<select id="dsty"></select></label>
<label>再生時間<select id="sec"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
</div>

<div class="bar">
<button class="btn" id="zip" disabled>全部まとめてZIP保存</button>
<span id="msg">絵を入れると、ここに結果が出ます</span>
</div>
<section id="edit" hidden>
<div class="eh"><canvas id="big"></canvas><div class="et"><b id="et"></b><label class="ck"><input type="checkbox" id="en" checked> ZIPに入れる</label></div><button class="btn sub sm" id="fold" type="button">せってい▲</button></div>
<div class="eg"><label>動き<select id="em"></select></label><label>飾り<select id="ed"></select></label><label>飾りの数<select id="edn"></select></label><label>飾りの色<select id="edl"></select></label><label>飾りの速さ<select id="eds"></select></label><label>飾りの動き<select id="edy"></select></label></div>
</section>
<div id="grid"></div>
<p class="note">絵をタップすると、その絵だけ動きと飾りを選び直せます（「おまかせ」に戻すこともできます）。ループ回数は、再生時間×回数が4秒以内になるよう自動で決まります。容量は規格（絵文字300KB・スタンプ1MB）に収まるよう色数を自動で減らします。ZIPには main.png と tab.png も入ります。</p>
</main>
<script>
const $=s=>document.querySelector(s);
const SPEC={emoji:{w:180,h:180,max:300*1024},stamp:{w:320,h:270,max:1024*1024}};
const ORDER=['purun','pyon','purun','yura','poyo','fuwa','doki','puyo','jump','neru','nobi','bikun','buru','kuru'];
const TAU=Math.PI*2;
const MOTION={
 purun:p=>{const s=Math.sin(p*TAU*2);return{sx:1+.09*s,sy:1-.09*s}},
 pyon:p=>{const h=Math.abs(Math.sin(p*TAU/2*2));const q=Math.pow(1-h,4);const sy=1+.05*h-.07*q;return{dy:-h*.1,sy,sx:1/sy}},
 yura:p=>({rot:.09*Math.sin(p*TAU)}),
 poyo:p=>{const s=1+.07*Math.sin(p*TAU*2);return{sx:s,sy:s}},
 fuwa:p=>({dy:-.04*Math.sin(p*TAU),rot:.03*Math.sin(p*TAU+1)}),
 bikun:p=>({dx:.03*Math.sin(p*TAU*4)*Math.max(0,1-p*1.6)}),
 doki:p=>{const v=1+.1*Math.pow(Math.abs(Math.sin(p*Math.PI*2)),10);return{sx:v,sy:v}},
 buru:p=>({dx:.012*Math.sin(p*TAU*8),rot:.02*Math.sin(p*TAU*8+1)}),
 kuru:p=>({sx:Math.cos(p*TAU)}),
 neru:p=>({dx:.06*Math.sin(p*TAU),rot:.04*Math.sin(p*TAU)}),
 nobi:p=>{const s=Math.sin(p*TAU*2);return{sx:1-.05*s,sy:1+.08*s}},
 puyo:p=>{const s=Math.cos(p*TAU*2);return{rot:.05*Math.sin(p*TAU*2),sx:1+.05*s,sy:1-.05*s}},
 jump:p=>{const h=Math.max(0,Math.sin(p*TAU));return{dy:-h*.16,sy:1+.06*h,sx:1-.04*h}},
 none:p=>({})
};
const MN={none:'動かさない',purun:'ぷるんぷるん',pyon:'ぴょんぴょん',yura:'ゆらゆら',poyo:'ぽよぽよ',fuwa:'ふわふわ',bikun:'びくっ',doki:'ドキドキ',buru:'ぶるぶる',kuru:'くるん',neru:'ゆらり左右',nobi:'のびのび',puyo:'ぷよぷよ',jump:'ジャンプ'};
const DN={none:'なし',kira:'きらきら',heart:'ハート',onpu:'おんぷ',line:'効果線',hana:'おはな',bikkuri:'！',hatena:'？'};
const DORDER=['kira','heart','kira','onpu','hana','line'];
let items=[]; // {sprite,on,motion}
let raf=0;

/* ---------- 読み込み〜自動切り分け ---------- */
function toCanvas(img){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d',{willReadFrequently:true}).drawImage(img,0,0);return c}
function bgOf(d,w,h){
 const pts=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([x,y])=>{const i=(y*w+x)*4;return[d[i],d[i+1],d[i+2],d[i+3]]});
 if(pts.some(p=>p[3]<16))return{t:true,c:[0,0,0]};
 return{t:false,c:[0,1,2].map(k=>pts.reduce((a,p)=>a+p[k],0)/4)};
}
const dist=(d,i,c)=>Math.abs(d[i]-c[0])+Math.abs(d[i+1]-c[1])+Math.abs(d[i+2]-c[2]);
function runs(arr,gap){const out=[];let s=-1,last=-1;for(let i=0;i<arr.length;i++){if(arr[i]>0){if(s<0)s=i;else if(i-last>gap){out.push([s,last]);s=i}last=i}}if(s>=0)out.push([s,last]);return out}
/* 並べた絵（グリッド）の境目を、すき間の位置から探す */
function gridCuts(p,n){
 let best=null;
 for(let r=2;r<=12;r++){
  const pitch=n/r,cuts=[];let ok=true;
  for(let k=1;k<r;k++){
   const c=k*pitch,lo=Math.floor(c-pitch*.25),hi=Math.ceil(c+pitch*.25);
   let bl=0,bs=-1,s=-1;
   for(let i=lo;i<=hi;i++){if(p[i]<=3){if(s<0)s=i;const L=i-s+1;if(L>bl){bl=L;bs=s}}else s=-1}
   if(bl<1){ok=false;break}
   cuts.push(bs+bl/2);
  }
  if(ok)best=cuts;
 }
 if(!best)return null;
 const e=[0,...best,n],out=[];
 for(let i=0;i<e.length-1;i++)out.push([Math.ceil(e[i]),Math.floor(e[i+1])-1]);
 return out;
}
function detect(cv){
 const w=cv.width,h=cv.height,d=cv.getContext('2d').getImageData(0,0,w,h).data,bg=bgOf(d,w,h);
 const m=new Uint8Array(w*h);
 for(let i=0;i<w*h;i++){const a=d[i*4+3];m[i]=a<16?0:(bg.t?1:(dist(d,i*4,bg.c)>54?1:0))}
 const g=Math.max(6,Math.round(Math.min(w,h)*.015));
 const rows=new Uint32Array(h);for(let y=0;y<h;y++){let s=0;for(let x=0;x<w;x++)s+=m[y*w+x];rows[y]=s}
 const rc=gridCuts(rows,h),cells=[];
 const bands=rc?rc:runs(rows,g);
 const cc=gridCuts((()=>{const c=new Uint32Array(w);for(let y=0;y<h;y++)for(let x=0;x<w;x++)c[x]+=m[y*w+x];return c})(),w);
 for(const[y0,y1]of bands){
  const cols=new Uint32Array(w);for(let y=y0;y<=y1;y++)for(let x=0;x<w;x++)cols[x]+=m[y*w+x];
  for(const[sx0,sx1]of(cc?cc:runs(cols,g))){
   let a=sx1,b=sx0,c=y1,d=y0;
   for(let y=y0;y<=y1;y++)for(let x=sx0;x<=sx1;x++)if(m[y*w+x]){if(x<a)a=x;if(x>b)b=x;if(y<c)c=y;if(y>d)d=y}
   if(b-a<12||d-c<12)continue;
   cells.push([a,c,b-a+1,d-c+1]);
  }
 }
 const big=Math.max(...cells.map(c=>c[2]*c[3]),0);
 return{cells:cells.filter(c=>c[2]*c[3]>big*.08),bg};
}
function cut(cv,box,bg){
 const pad=1,x0=Math.max(0,box[0]-pad),y0=Math.max(0,box[1]-pad),w=Math.min(cv.width-x0,box[2]+pad*2),h=Math.min(cv.height-y0,box[3]+pad*2);
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});
 x.drawImage(cv,x0,y0,w,h,0,0,w,h);
 if(!bg.t){
  const im=x.getImageData(0,0,w,h),d=im.data,rm=new Uint8Array(w*h),st=[];
  const T=48,ok=i=>!rm[i]&&dist(d,i*4,bg.c)<=T;
  const push=i=>{if(ok(i)){rm[i]=1;st.push(i)}};
  for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}
  while(st.length){const i=st.pop(),px=i%w,py=(i/w)|0;
   if(px>0)push(i-1);if(px<w-1)push(i+1);if(py>0)push(i-w);if(py<h-1)push(i+w)}
  for(let i=0;i<w*h;i++){
   if(rm[i]){d[i*4+3]=0;continue}
   const px=i%w,py=(i/w)|0;
   const nb=(px>0&&rm[i-1])||(px<w-1&&rm[i+1])||(py>0&&rm[i-w])||(py<h-1&&rm[i+w]);
   if(nb){const k=dist(d,i*4,bg.c);if(k<100)d[i*4+3]=Math.round(255*Math.max(0,Math.min(1,(k-T)/(100-T))))}
  }
  x.putImageData(im,0,0);
 }
 return trim(c);
}
function trim(c){
 const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data;
 let a=w,b=h,e=-1,f=-1;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>20){if(x<a)a=x;if(x>e)e=x;if(y<b)b=y;if(y>f)f=y}
 if(e<0)return c;
 const o=document.createElement('canvas');o.width=e-a+1;o.height=f-b+1;o.getContext('2d').drawImage(c,a,b,o.width,o.height,0,0,o.width,o.height);return o;
}
async function load(files){
 $('#msg').textContent='切り分け中…';items=[];sel=0;
 for(const f of files){
  const bmp=await createImageBitmap(f);const cv=toCanvas(bmp);
  const{cells,bg}=detect(cv);
  const boxes=cells.length?cells:[[0,0,cv.width,cv.height]];
  for(const b of boxes)items.push({sprite:cut(cv,b,bg),on:true});
 }
 build();
}

/* ---------- フレーム生成 ---------- */
const secN=()=>+$('#sec').value;
const nFrames=()=>Math.min(20,10*secN());
function motionFor(i){const m=$('#motion').value;return m==='auto'?ORDER[i%ORDER.length]:m}
function star(x,cx,cy,r,col){x.fillStyle=col;x.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4-Math.PI/2,rr=k%2?r*.32:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath();x.fill()}
function heart(x,cx,cy,r,col){x.fillStyle=col;x.beginPath();x.moveTo(cx,cy+r*.9);x.bezierCurveTo(cx-r*1.4,cy-r*.1,cx-r*.7,cy-r*1.2,cx,cy-r*.4);x.bezierCurveTo(cx+r*.7,cy-r*1.2,cx+r*1.4,cy-r*.1,cx,cy+r*.9);x.fill()}
const al=(x,v,f)=>{x.save();x.globalAlpha=Math.max(0,Math.min(1,v));f();x.restore()};
function mark(x,S,p,t,c,o){const s=1+.15*Math.sin(p*TAU*2);[[.86,.2,.2],[.12,.22,-.2],[.9,.7,.15]].slice(0,Math.ceil(o.n/3)).forEach(([fx,fy,r])=>{x.save();x.translate(S.w*fx,S.h*fy);x.rotate(r);x.scale(s,s);x.fillStyle=dpick(o,c);x.font='900 '+S.w*.2+'px "Zen Maru Gothic",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,0,0);x.restore()})}
const dpick=(o,d)=>o.c||d;
const DECO={
 kira:(x,S,p,o)=>{const D=['#ffe989'];[[.13,.17,0],[.87,.24,.33],[.82,.86,.66],[.12,.8,.15],[.5,.07,.5],[.93,.55,.85]].slice(0,o.n).forEach(([fx,fy,q],j)=>{const s=Math.max(0,Math.sin((p+q)*TAU));if(s>.05)star(x,fx*S.w,fy*S.h,S.w*.07*s,dpick(o,D[0]))})},
 heart:(x,S,p,o)=>{[.12,.88,.8,.2,.94,.06].slice(0,o.n).forEach((fx,j)=>{const q=(p+j/o.n)%1;al(x,Math.sin(q*Math.PI)*1.4,()=>heart(x,fx*S.w,(.75-.5*q)*S.h,S.w*.05,dpick(o,'#ff8fb8')))})},
 onpu:(x,S,p,o)=>{[.1,.86,.2,.78,.05,.92].slice(0,o.n).forEach((fx,j)=>{const q=(p+j/o.n)%1;al(x,Math.sin(q*Math.PI)*1.4,()=>{x.fillStyle=dpick(o,'#b79cff');x.font='900 '+S.w*.13+'px sans-serif';x.fillText(j%2?'\u266b':'\u266a',fx*S.w,(.4-.2*q+(j%3)*.12)*S.h)})})},
 line:(x,S,p,o)=>{const w=Math.sin(p*TAU*2)*.02,K=o.n*2+2;x.strokeStyle=dpick(o,'#ffa6d2');x.lineWidth=S.w*.018;x.lineCap='round';for(let k=0;k<K;k++){const a=k*TAU/K+Math.PI/K,r1=S.w*(.4+w),r2=r1+S.w*.07;x.beginPath();x.moveTo(S.w/2+Math.cos(a)*r1,S.h/2+Math.sin(a)*r1);x.lineTo(S.w/2+Math.cos(a)*r2,S.h/2+Math.sin(a)*r2);x.stroke()}},
 hana:(x,S,p,o)=>{[.09,.78,.22,.91,.04,.96].slice(0,o.n).forEach((fx,j)=>{const q=(p+j/o.n)%1,cx=fx*S.w+Math.sin(q*TAU)*S.w*.02,cy=(-.05+1.1*q)*S.h;x.fillStyle=dpick(o,'#ffc2dd');for(let k=0;k<5;k++){const a=k*TAU/5+q*TAU;x.beginPath();x.arc(cx+Math.cos(a)*S.w*.03,cy+Math.sin(a)*S.w*.03,S.w*.022,0,TAU);x.fill()}x.fillStyle='#ffe27a';x.beginPath();x.arc(cx,cy,S.w*.016,0,TAU);x.fill()})},
 bikkuri:(x,S,p,o)=>mark(x,S,p,'\uff01','#ff7aa8',o),
 hatena:(x,S,p,o)=>mark(x,S,p,'\uff1f','#8f9cff',o)
};
function makeFrames(sp,motion,deco,S,N,sec,o){
 const out=[],k=Math.min(S.w*.8/sp.width,S.h*.8/sp.height),dw=sp.width*k,dh=sp.height*k;
 for(let i=0;i<N;i++){
  const p=((i*sec)/N)%1,m=MOTION[motion](p);
  const c=document.createElement('canvas');c.width=S.w;c.height=S.h;const x=c.getContext('2d');
  x.imageSmoothingQuality='high';
  x.save();x.translate(S.w/2+(m.dx||0)*S.w,(S.h+dh)/2+S.h*.02+(m.dy||0)*S.h);
  x.rotate(m.rot||0);x.scale(m.sx||1,m.sy||1);x.drawImage(sp,-dw/2,-dh,dw,dh);x.restore();
  if(deco&&DECO[deco]){
   const pd=o.spd==='stop'?.25:((i/N)*(o.spd==='slow'?1:o.spd==='fast'?sec*2:sec))%1,cx=S.w/2,cy=S.h/2;
   x.save();
   if(o.sty==='blink')x.globalAlpha=.4+.6*Math.abs(Math.sin(pd*Math.PI*2));
   else if(o.sty==='pulse'){const k=1+.12*Math.sin(pd*TAU);x.translate(cx,cy);x.scale(k,k);x.translate(-cx,-cy)}
   else if(o.sty==='swing'){x.translate(cx,cy);x.rotate(.1*Math.sin(pd*TAU));x.translate(-cx,-cy)}
   else if(o.sty==='float')x.translate(0,S.h*.03*Math.sin(pd*TAU));
   DECO[deco](x,S,pd,o);x.restore();
  }
  out.push(c);
 }
 return out;
}

/* ---------- 画面 ---------- */
let sel=0;
function decoFor(i){const d=$('#deco').value;return d==='auto'?DORDER[i%DORDER.length]:d}
function cfg(i){const it=items[i];return{m:it.mo||motionFor(i),d:it.dc||decoFor(i)}}
function refresh(i){
 const S=SPEC[$('#kind').value],it=items[i],c=cfg(i);
 it.frames=makeFrames(it.sprite,c.m,c.d==='none'?'':c.d,S,nFrames(),secN(),{n:+(it.dn||$('#dnum').value),c:it.dl||$('#dcol').value,spd:it.ds||$('#dspd').value,sty:it.dy||$('#dsty').value});

}
function build(){
 cancelAnimationFrame(raf);
 const S=SPEC[$('#kind').value],grid=$('#grid');grid.innerHTML='';
 $('#edit').hidden=!items.length;
 const big=$('#big');big.width=S.w;big.height=S.h;
 items.forEach((it,i)=>{
  const d=document.createElement('div');d.className='cell'+(it.on?'':' off');
  const cv=document.createElement('canvas');cv.width=S.w;cv.height=S.h;it.view=cv;d.append(cv);
  it.lab=document.createElement('small');d.append(it.lab);it.cell=d;
  d.onclick=()=>pick(i);grid.append(d);refresh(i);
 });
 if(!items.length)return;
 if(sel>=items.length)sel=0;
 pick(sel);count();
 const t0=performance.now(),delay=secN()*1000/nFrames(),N=nFrames();
 const tick=t=>{const f=Math.floor((t-t0)/delay)%N;
  for(const it of items){const x=it.view.getContext('2d');x.clearRect(0,0,it.view.width,it.view.height);x.drawImage(it.frames[f],0,0)}
  const bx=big.getContext('2d');bx.clearRect(0,0,big.width,big.height);bx.drawImage(items[sel].frames[f],0,0);
  raf=requestAnimationFrame(tick)};
 raf=requestAnimationFrame(tick);
}
function count(){const n=items.filter(i=>i.on).length;$('#msg').textContent=n?`${n}個できました（動きと飾りは自動で割り当て済み）`:'保存する絵がありません';$('#zip').disabled=!n}
$('#em').onchange=()=>{items[sel].mo=$('#em').value||null;refresh(sel)};
$('#ed').onchange=()=>{items[sel].dc=$('#ed').value||null;refresh(sel)};
$('#edn').onchange=()=>{items[sel].dn=$('#edn').value||null;refresh(sel)};
$('#edl').onchange=()=>{items[sel].dl=$('#edl').value||null;refresh(sel)};

$('#en').onchange=()=>{const it=items[sel];it.on=$('#en').checked;it.cell.classList.toggle('off',!it.on);count()};
const opt=(k,v)=>`<option value="${k}">${v}</option>`,mo=Object.entries(MN).map(([k,v])=>opt(k,v)).join(''),dc=Object.entries(DN).map(([k,v])=>opt(k,v)).join('');
$('#motion').innerHTML=opt('auto','おまかせ（バラバラ）')+mo;

const SPD={stop:'とめる',slow:'ゆっくり',norm:'ふつう',fast:'はやい'},STY={std:'標準',blink:'ぴかぴか',pulse:'ぽよん',swing:'ゆらゆら',float:'ふわふわ'};
const CN={'#ff8fc4':'ピンク','#ffd84d':'きいろ','#7cc4ff':'みずいろ','#b79cff':'むらさき','#6fd9b0':'みどり','#ff5d6c':'あかい'},NN={2:'少なめ',3:'ふつう',4:'多め',6:'たっぷり'};

/* ---------- APNG書き出し ---------- */
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b,s,e){let c=~0;for(let i=s;i<e;i++)c=CRC[(c^b[i])&255]^(c>>>8);return~c>>>0}
function setLoops(buf,loops){
 const u=new Uint8Array(buf),dv=new DataView(buf);
 for(let i=8;i<u.length-12;i++){
  if(u[i]===0x61&&u[i+1]===0x63&&u[i+2]===0x54&&u[i+3]===0x4c){dv.setUint32(i+8,loops);dv.setUint32(i+12,crc32(u,i,i+12));break}
 }
 return buf;
}
function encode(frames,S,sec,max){
 const N=frames.length,delay=sec*1000/N,loops=Math.max(1,Math.min(4,Math.floor(4/sec)));
 const bufs=frames.map(f=>f.getContext('2d').getImageData(0,0,S.w,S.h).data.buffer.slice(0));
 let best=null;
 for(const cn of[256,128,64,32,16]){
  best=UPNG.encode(bufs,S.w,S.h,cn,frames.map(()=>delay));
  if(best.byteLength<=max)break;
 }
 return{buf:setLoops(best,loops),over:best.byteLength>max};
}
function staticPng(cv,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const k=Math.min(w/cv.width,h/cv.height);x.drawImage(cv,(w-cv.width*k)/2,(h-cv.height*k)/2,cv.width*k,cv.height*k);return new Promise(r=>c.toBlob(r))}
async function save(name,data){
  const dl=await claude.use('downloads');
  if(!dl){$('#msg').textContent='この画面では保存できません。公開ページとして開いてください';return}
  try{await dl.save({filename:name,data})}catch(e){if(e.code!=='declined')$('#msg').textContent='保存できませんでした（'+e.code+'）'}
}
$('#zip').onclick=async()=>{
 const S=SPEC[$('#kind').value],sec=secN(),isE=$('#kind').value==='emoji',z=new JSZip();
 const list=items.filter(i=>i.on);let over=0;
 $('#zip').disabled=true;
 for(let i=0;i<list.length;i++){
  $('#msg').textContent=`書き出し中… ${i+1}/${list.length}`;await new Promise(r=>setTimeout(r,0));
  const r=encode(list[i].frames,S,sec,S.max);if(r.over)over++;
  z.file((isE?String(i+1).padStart(3,'0'):String(i+1).padStart(2,'0'))+'.png',r.buf);
 }
 const f0=list[0].frames[0];
 if(!isE)z.file('main.png',await staticPng(f0,240,240));
 z.file('tab.png',await staticPng(f0,96,74));
 const blob=await z.generateAsync({type:'blob'});
 $('#zip').disabled=false;
 $('#msg').textContent=over?`${over}個が規格の容量を超えています。絵をシンプルにするか再生時間を短くしてください`:'書き出しできました';
 save((isE?'emoji':'stamp')+'-apng.zip',blob);
};
['kind','motion','deco','sec','dnum','dcol','dspd','dsty'].forEach(id=>$('#'+id).onchange=()=>items.length&&build());
const drop=$('#drop'),fi=$('#file');
drop.onclick=()=>fi.click();
drop.onkeydown=e=>{if(e.key==='Enter')fi.click()};
fi.onchange=()=>fi.files.length&&load([...fi.files]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');load([...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')))};
